<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শুভ জন্মদিন তাসমিয়া! 🎂✨</title>

<!-- Google Font: Noto Sans Bengali -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body{
    min-height: 100vh;
    font-family: 'Noto Sans Bengali', sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    position: relative;
    padding: 15px;
}

/* Floating background elements */
.floating-bg {
    position: fixed;
    bottom: -50px;
    font-size: 24px;
    animation: floatUp 8s linear infinite;
    opacity: 0.6;
    z-index: 1;
    pointer-events: none;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    20% {
        opacity: 0.8;
    }
    100% {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
    }
}

.card-container {
    width: 100%;
    max-width: 440px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 28px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(255, 105, 135, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.5);
    position: relative;
    z-index: 10;
    animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.icon-header {
    font-size: 52px;
    margin-bottom: 12px;
    display: inline-block;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
}

h1 {
    color: #ff3366;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 14px;
    line-height: 1.4;
}

p {
    font-size: 16px;
    line-height: 1.8;
    color: #4a4a4a;
    margin-bottom: 15px;
}

.highlight-text {
    color: #e6005c;
    font-weight: 700;
}

.btn-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

button {
    border: none;
    outline: none;
    border-radius: 50px;
    padding: 14px 22px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.btn-primary {
    background: linear-gradient(135deg, #ff3366, #ff6b8b);
    color: #ffffff;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 51, 102, 0.4);
}

.btn-secondary {
    background: #ffe3ea;
    color: #ff3366;
}

.btn-secondary:hover {
    background: #ffd0dc;
    transform: translateY(-2px);
}

/* Funny Popup Box */
.popup-box {
    background: #fff0f3;
    color: #d81b60;
    border: 2px dashed #ff80ab;
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    margin: 10px 0;
    display: none;
    animation: popBounce 0.4s ease;
}

@keyframes popBounce {
    0% { transform: scale(0.8); opacity: 0; }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
}

.gift-container {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin: 18px 0;
}

.gift-card {
    flex: 1;
    background: #ffffff;
    border-radius: 14px;
    padding: 8px;
    border: 1px solid #ffccd5;
    box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.gift-card img {
    width: 100%;
    height: 75px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 6px;
}

.gift-card span {
    font-size: 11px;
    font-weight: 700;
    color: #333;
    line-height: 1.3;
}

.broken-card {
    background: #fff5f5;
    border-color: #ff8a8a;
}

.broken-badge {
    font-size: 10px;
    background: #ffe0e0;
    color: #d32f2f;
    padding: 2px 5px;
    border-radius: 6px;
    margin-top: 3px;
    font-weight: bold;
}

.confetti {
    position: fixed;
    top: -20px;
    z-index: 100;
    pointer-events: none;
    animation: fallDown 4s linear forwards;
}

@keyframes fallDown {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}
</style>
</head>
<body>

<div class="card-container" id="mainCard">
    <!-- Content rendered by JavaScript -->
</div>

<script>

// Function to render Page 1
function renderPage1() {
    const card = document.getElementById('mainCard');
    card.innerHTML = `
        <div class="icon-header">🐴✨</div>
        <h1>একটি বিশেষ ঘোষণা!</h1>
        <p>সম্মানিত লেজ বিহীন কান বিহীন গাধা কেমন আছেন? 🧐</p>
        
        <div id="popup1" class="popup-box">
            🤪 খুব বুদ্ধিমান না ভেবে 'ভালো আছি'তে ক্লিক কর!
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="changePage(renderPage2)">ভালো আছি 🥰</button>
            <button class="btn-secondary" onclick="showPopup('popup1')">এভাবে না বললেও পারতিস 😒</button>
        </div>
    `;
}

// Function to render Page 2
function renderPage2() {
    const card = document.getElementById('mainCard');
    card.innerHTML = `
        <div class="icon-header">🌸🙈</div>
        <h1>রাগ করলি নাকি?</h1>
        <p>রাগ করিস না... আজকের দিনটা যে কতটা বিশেষ, জানিস তুই? 💖</p>
        
        <div id="popup2" class="popup-box">
            🧐 এত অবিশ্বাস কেন?? 'কী?' এর ওপর ক্লিক কর!
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="changePage(renderPage3)">কী? 🤔</button>
            <button class="btn-secondary" onclick="showPopup('popup2')">আবার আবল তাবল কিছু বলবি 🙄</button>
        </div>
    `;
}

// Function to render Page 3
function renderPage3() {
    const card = document.getElementById('mainCard');
    card.innerHTML = `
        <div class="icon-header">✨👑</div>
        <h1>এক বিশেষ আগমন!</h1>
        <p>
            আজ এমন এক বিশেষ মানুষের জন্মদিন, যার পৃথিবীতে আগমনে আমাদের চারপাশটা অনেক বেশি হাসিখুশি, উজ্জ্বল ও রঙিন হয়ে উঠেছে... 
        </p>
        <p class="highlight-text">
            আমাদের প্রিয় তাসমিয়া! 🎉💖
        </p>

        <div class="btn-group">
            <button class="btn-primary" onclick="changePage(renderPage4)">তোর জন্য কী এনেছি দেখবি? 🎁</button>
        </div>
    `;
}

function renderPage4() {
    const card = document.getElementById('mainCard');
    card.innerHTML = `
        <div class="icon-header">☕💥</div>
        <h1>তোর উপহারের গল্প!</h1>
        <p style="font-size:14px; margin-bottom:10px;">তোর জন্য খুব শখ করে ৩টি উপহার পছন্দ করেছিলাম:</p>

        <div class="gift-container">
            <div class="gift-card">
                <img src="gift1.jpg" alt="Gift 1" onerror="this.onerror=null; this.src='https://placehold.co/100x100/ffccd5/ff3366?text=Flower';">
                <span>ফ্লাওয়ার শোপিস 🌸</span>
            </div>
            <div class="gift-card">
                <img src="gift2.jpg" alt="Gift 2" onerror="this.onerror=null; this.src='https://placehold.co/100x100/ffccd5/ff3366?text=Ring';">
                <span>আংটি ও এক্সেসরিজ 💍</span>
            </div>
            <div class="gift-card broken-card">
                <img src="gift3.jpg" alt="Gift 3" style="filter: grayscale(70%);" onerror="this.onerror=null; this.src='https://placehold.co/100x100/ffe0e0/d32f2f?text=Broken+Mug';">
                <span>মার্বেল মগ ☕</span>
                <span class="broken-badge">💔 চূর্ণ-বিচূর্ণ!</span>
            </div>
        </div>

        <p class="highlight-text" style="font-size:14px;">
            কিন্তু তোর বিখ্যাত "ফাটা কপালের" ধাক্কায় আসার পথেই মগটা হাত থেকে পড়ে ভেঙে চূর্ণ-বিচূর্ণ হয়ে গেল! 😭💔
        </p>

        <div class="btn-group">
            <button class="btn-primary" onclick="changePage(renderPage5)">শুভ কামনার জন্য ক্লিক কর 🎉</button>
        </div>
    `;
}

function renderPage5() {
    const card = document.getElementById('mainCard');
    triggerConfetti();

    card.innerHTML = `
        <div class="icon-header">🥳🎂✨</div>
        <h1>শুভ জন্মদিন তাসমিয়া!</h1>
        <p class="highlight-text" style="font-size: 18px;">
            তুই আমাদের সবচেয়ে প্রিয় ও স্পেশাল বন্ধু! ❤️
        </p>
        <p>
            ভাঙা মগ আর ফাজলামো যাই হোক না কেন, তোর জীবনের প্রতিটি দিন যেন অনেক আনন্দ, হাসিখুশি আর সাফল্যে ভরে থাকে। 🌸
            <br><br>
            <b>অনেক তো হলো, এবার কিন্তু কেক আর বিরিয়ানির ট্রিট মাস্ট চাই-ই চাই! 🍰🍗✨</b>
        </p>
        <div style="font-size: 32px; margin-top: 10px;">
            🎈 🎁 🎊 🚀 🎉
        </div>
    `;
}

// Utility function to show popup
function showPopup(popupId) {
    const popup = document.getElementById(popupId);
    if(popup) {
        popup.style.display = 'block';
    }
}

// Page transition helper
function changePage(pageRenderFunction) {
    const card = document.getElementById('mainCard');
    card.style.animation = 'none';
    card.offsetHeight; // trigger reflow
    pageRenderFunction();
    card.style.animation = 'slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
}

// Falling confetti animation generator
function triggerConfetti() {
    const symbols = ['🎉', '🎂', '🎈', '✨', '🎁', '💖', '🌸', '🥳'];
    for (let i = 0; i < 70; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
        confetti.style.fontSize = (16 + Math.random() * 20) + 'px';
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
    }
}

// Floating background elements loop
setInterval(() => {
    const floatEl = document.createElement('div');
    floatEl.className = 'floating-bg';
    floatEl.innerText = ['🎈', '🎂', '✨', '🌸', '💖'][Math.floor(Math.random() * 5)];
    floatEl.style.left = Math.random() * 100 + 'vw';
    floatEl.style.fontSize = (18 + Math.random() * 16) + 'px';
    floatEl.style.animationDuration = (6 + Math.random() * 4) + 's';
    document.body.appendChild(floatEl);

    setTimeout(() => floatEl.remove(), 10000);
}, 700);

window.onload = function() {
    renderPage1();
};
</script>
</body>
</html>
